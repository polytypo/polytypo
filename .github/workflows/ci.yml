name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Pulls the "polytypo" devDependency from polytypo/polytypo-js#main (a git dependency, not
      # the npm registry — see docs/REPOSITORY_SPLIT_AND_SPEC_SYNC.md). That repo's own "prepare"
      # script builds it during this step, so its dist/ is ready for gen:promo-bundle below.
      - run: npm ci

      # gen:brandbook (part of `npm run generate:all`, invoked below) shells out to
      # `python3 brand/tools/build_brandbook.py`, which needs fonttools (subsetting, WOFF2) and
      # brotli (WOFF2's compression codec) — packages `npm ci` does not and should not install.
      # An isolated venv with only the pinned versions from brand/tools/requirements.txt, not the
      # runner's own preinstalled global site-packages, so generation is exactly as reproducible
      # here as it is documented to be in brand/README.md. Prepending the venv's bin/ to
      # $GITHUB_PATH makes every subsequent step's bare `python3`/`pip` resolve inside it, without
      # needing to re-activate per step.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up isolated Python virtual environment for brand/promo generation
        run: |
          python3 -m venv .venv-brand
          echo "$PWD/.venv-brand/bin" >> "$GITHUB_PATH"
          .venv-brand/bin/pip install -r brand/tools/requirements.txt

      # gen_svg.py's ensure_font(): a cached font is re-verified by sha256 on every use, a fresh
      # download is checksum-verified before being atomically moved into place, and a mismatch of
      # either kind fails loudly instead of silently falling back. No network access — the
      # downloader is a fake injected by the test. See brand/tools/test_gen_svg.py.
      - name: Font-acquisition tests
        run: npm run test:font-acquisition

      - name: Validate spec
        run: npm run validate:spec

      - name: Lint
        run: npm run lint

      # Static check: no `${{ ... }}` GitHub Actions expression is embedded in a `run:` step's
      # shell text anywhere in .github/workflows/ — a git tag or other GitHub context value can
      # contain shell metacharacters, so it must always be passed through a step-level `env:` var
      # instead. See scripts/lib/workflow-shell-safety.mjs.
      - name: Workflow shell-safety check
        run: npm run check:workflow-shell-safety

      # Static check: every external `uses:` reference in .github/workflows/ is pinned to an
      # immutable full 40-character commit SHA, never a mutable tag/branch or an abbreviated SHA.
      # See scripts/check-actions-pinned.mjs.
      - name: Actions-pinned check
        run: npm run check:actions-pinned

      - name: Test
        run: npm test

      # One deterministic entry point (npm run generate:all: READMEs, promo pages/assets, browser
      # bundle, brandbook — gen:docs + gen:promo-bundle + gen:brandbook, in that order), then a
      # hard, scoped git diff — no continue-on-error, and no second, competing generation path.
      # spec/VERSION is the single global spec-version source (docs/ARCHITECTURE.md section 2,
      # "L0 — spec"); scripts/validate-spec.mjs separately asserts order.json/registry.json never
      # drift from it.
      #
      # Every promo page (all five — index plus the docs/playground/locales/manifesto directory
      # indexes, served at the directory URLs /, /docs, /playground, /locales, /manifesto),
      # promo/robots.txt, promo/sitemap.xml and brand/BRANDBOOK.html are tracked, generated files
      # and belong in this list.
      #
      # spec/fixtures/.escaped/ is gitignored by design (never committed), so it cannot be
      # drift-checked via git diff here; its generation is exercised deterministically by the
      # Validate-spec step above instead.
      - name: Check generated artifacts are up to date
        run: |
          npm run generate:all
          git diff --exit-code -- \
            README.md \
            promo/examples.json \
            promo/index.html \
            promo/docs/index.html \
            promo/locales/index.html \
            promo/playground/index.html \
            promo/manifesto/index.html \
            promo/robots.txt \
            promo/sitemap.xml \
            promo/assets \
            promo/vendor/polytypo.browser.js \
            brand/BRANDBOOK.html \
            spec/CONFORMANCE.md
