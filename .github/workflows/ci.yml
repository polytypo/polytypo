name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Validate spec
        run: npm run validate:spec

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check generated docs are up to date
        run: |
          npm run gen:docs
          git checkout -- promo/index.html promo/examples.json
          git diff --exit-code -- README.md docs/ports

      # Non-blocking for now: brand/tools/build_promo.py still lags the shipped promo/index.html
      # (older, simpler brand CSS instead of the current design system) and gen_examples.ts's
      # LOCALES list is hand-maintained separately from spec/locales/registry.json. Flip to a
      # hard `git diff --exit-code` on promo/examples.json and promo/index.html too once both are
      # brought back in sync — see docs/agents/agent-system-audit.md.
      - name: Check generated promo page is up to date
        continue-on-error: true
        run: |
          npm run gen:docs
          git diff -- promo/examples.json promo/index.html
