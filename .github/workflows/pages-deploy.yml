name: Deploy to GitHub Pages

# Prepared per docs/REPOSITORY_SPLIT_AND_SPEC_SYNC.md §7.3. Two ways this runs, both gated the
# same way: (1) automatically, once the canonical CI workflow finishes on a push to main —
# `on.workflow_run` below, filtered to `event == 'push'` and `conclusion == 'success'` so a failed
# run or a pull_request's own CI run can never trigger a deploy; or (2) a human choosing "Run
# workflow" on this exact file and typing a commit SHA (redeploying an older commit, or a tagged
# site-vX.Y.Z release, without main needing to be at that point anymore). A tag push or a PR merge
# by itself never runs this — only CI succeeding on main, or an explicit manual dispatch, do.
# Either way, the `verify` job below independently re-proves that commit's provenance and CI
# status before `deploy` builds or uploads a single byte — the workflow_run trigger's own
# conclusion is a necessary condition to even reach `verify`, never treated as sufficient on its
# own. Environment approval (§7.1's protected `github-pages` environment) is an ADDITIONAL gate on
# top of that provenance check, never a substitute for it — see `deploy`'s own `environment:` key.
# GitHub protects a Pages-sourced `github-pages` environment by default (restricted to the default
# branch); a required-reviewer rule is a separate, manual step in Settings → Environments this
# workflow file cannot configure for you.
#
# THE RELEASE-WINDOW GATE (added after spec 1.4.0). Every release necessarily puts main ahead of
# the registries for a while: the version bump and the changelog entry land, then the five
# packages publish minutes or hours later. With only the workflow_run trigger, that window got
# published — the site announced spec 1.4.0 while npm still served 1.3.1, which is exactly what
# the project's "describe only what ships" rule forbids. `verify` now ends by asking all five
# registries what they actually serve, and `deploy` is SKIPPED, not failed, while any of them is
# behind: a skip is the correct outcome mid-release, and a red run would be noise every time.
#
# Two consequences worth stating, because they are what make this automatic rather than a manual
# step:
#   - the `schedule` trigger below re-checks on its own, so the deploy happens once the last
#     package lands without anyone pushing anything or clicking anything;
#   - a scheduled run stops early when the live site already claims the version main is at, so
#     the common case (nothing to publish) costs one HTTP request, not a rebuild.
# The comparison is ">= the spec version", not "==", so it still holds if a runtime's package
# version is ever allowed to run ahead of the spec version it implements.
#
# A workflow_dispatch DELIBERATELY bypasses the gate: redeploying a past site-vX.Y.Z tag, or
# pushing out a site-only fix, is a human saying they know what they are publishing.
#
# Before this is used for a real, public, "announce the domain" launch: §7.3 flags
# cache-safe (content-hashed) asset naming as a required pre-launch gate that is NOT implemented
# yet — promo/vendor/polytypo.browser.js, promo/assets/site.js and promo/assets/style.css all
# still have fixed filenames, so a redeploy is not guaranteed to invalidate a visitor's cached
# copy. A successful run of this workflow proves the deploy mechanism works; it does not by
# itself mean the site is ready to announce.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact commit SHA to deploy (must be on main, or tagged site-vX.Y.Z). Leave empty to deploy the current tip of main."
        required: false
        type: string
  # Fires once ci.yml finishes running, for any of its own triggers (push to main/master, or a
  # pull_request) — narrowed to "the push-to-main case, and only if it passed" by the `verify` job
  # condition below, not by this trigger's own `branches:` filter alone (that filter matches the
  # upstream run's head branch, which is the PR's source branch for a pull_request run, not
  # necessarily unrelated to "main" in an unusual naming case — the job-level `event == 'push'`
  # check is the real, unambiguous guard).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # The retry path for the release window. A push that landed while the registries were still
  # behind is not lost and needs no human: this fires every half hour, finds the gate now open,
  # and publishes the tip of main. When there is nothing to publish it exits before doing any
  # work — see "Skip a scheduled run when the live site is already current" below.
  schedule:
    - cron: "*/30 * * * *"

# Read-only at the workflow level; the two jobs below grant themselves exactly what they each
# need, narrowly, and nothing more.
permissions:
  contents: read

# One deploy at a time, and never cancel one that's already running mid-way through a Pages
# publish — a cancelled `deploy-pages` step can leave the environment in an inconsistent state.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify commit provenance
    runs-on: ubuntu-latest
    # A manual dispatch always reaches this job (its own required-ness of `inputs.sha` isn't
    # gated here). A workflow_run event only reaches it for the exact case documented above: CI's
    # own trigger was a push (never a pull_request run), and CI concluded successfully — anything
    # else (a failed run, a PR run against main) stops here and `deploy` below never even starts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      publishable: ${{ steps.registries.outputs.publishable }}
    steps:
      # fetch-depth: 0 (full history) — the ancestry check below needs it, and a shallow clone
      # would make every commit look like a root with no ancestors.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Three ways to land here, in priority order: an explicit `inputs.sha` (manual redeploy of a
      # specific commit or site-vX.Y.Z tag); `workflow_run`'s own `head_sha` (the automatic path —
      # the exact commit CI just finished checking, never this workflow's own implicit
      # `github.sha`, which for a workflow_run event is the branch tip *at event time* and could in
      # principle race ahead of it); or, a manual dispatch with the SHA field left empty,
      # `github.sha` (the tip of main the dispatch itself resolved against) as the final fallback.
      # Every one of these is attacker-influenced the same way a git tag name is
      # (docs/REPOSITORY_SPLIT_AND_SPEC_SYNC.md §4.4's precedent), so it goes through a step-level
      # `env` var and is referenced as a quoted shell variable, never interpolated with `${{ }}`
      # directly into `run:` text. See scripts/lib/workflow-shell-safety.mjs.
      #
      # `git rev-parse "<sha>^{commit}"` both proves the object exists AND that it is a commit
      # (not a blob/tree/tag), and expands any abbreviated-but-unambiguous prefix the input might
      # have used to the real full SHA — everything downstream (including the deploy job's own
      # checkout) then pins to that resolved value, never the raw, unverified input string again.
      - name: Resolve and pin the requested SHA
        id: pin
        env:
          REQUESTED_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${REQUESTED_SHA}^{commit}" 2>/dev/null; then
            echo "::error::${REQUESTED_SHA} does not exist in this repository, or is not a commit"
            exit 1
          fi
          full_sha=$(git rev-parse "${REQUESTED_SHA}^{commit}")
          echo "resolved to ${full_sha}"
          echo "sha=${full_sha}" >> "$GITHUB_OUTPUT"

      # Two acceptable proofs of reachability, either one sufficient: an ancestor of the current
      # tip of main (the ordinary case — deploying what's already landed), or an exact match for
      # one of this project's own site-vX.Y.Z tags (so a specific past release can be redeployed
      # later even after main has moved past it, without that tag needing to still be reachable
      # from main's then-current tip). No other tag pattern and no branch other than main counts.
      - name: Verify the commit is reachable from main, or matches an allowed site-vX.Y.Z tag
        env:
          PINNED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${PINNED_SHA}" origin/main; then
            echo "ok — ${PINNED_SHA} is an ancestor of main"
            exit 0
          fi
          for tag in $(git tag -l 'site-v*'); do
            if [ "$(git rev-list -n 1 "$tag")" = "${PINNED_SHA}" ]; then
              echo "ok — ${PINNED_SHA} matches allowed tag ${tag}"
              exit 0
            fi
          done
          echo "::error::${PINNED_SHA} is neither an ancestor of main nor tagged site-vX.Y.Z — refusing to deploy an unreviewed object"
          exit 1

      # Not "some CI run exists somewhere for this repository," and not a result for a different
      # commit on the same branch — the exact head_sha the workflow_dispatch input resolved to,
      # for the exact canonical CI workflow file, and its most recent run if the same commit was
      # ever re-run. A workflow run's own `conclusion` is already "success" only if every job in
      # it (both Node 20 and Node 22 in ci.yml's matrix) succeeded — GitHub does not report a
      # run-level success when any matrix leg failed, fail-fast or not.
      - name: Verify canonical CI passed for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          # `gh api --jq` takes exactly one filter-string argument — it does not expose jq's own
          # `--arg` flag for passing variables in separately (that combination silently becomes
          # multiple positional args to `gh api` itself, not to jq, and `gh` rejects it: "accepts
          # 1 arg(s), received 4"). PINNED_SHA is safe to interpolate directly into the filter
          # string: it is always exactly the 40 hex characters `git rev-parse ...^{commit}`
          # resolved above, never the raw workflow_dispatch input, so it cannot smuggle a `"` or
          # any other jq/shell metacharacter.
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${PINNED_SHA}\")] | sort_by(.run_started_at) | last | .conclusion // \"missing\"")
          if [ "${conclusion}" != "success" ]; then
            echo "::error::canonical CI has not passed for ${PINNED_SHA} (found: ${conclusion})"
            exit 1
          fi
          echo "ok — canonical CI conclusion for ${PINNED_SHA} is success"

      # The release-window gate (see the header). Everything above proves the commit is one we may
      # publish; this proves the SITE IT WOULD PRODUCE is one we may publish — that every runtime
      # actually serves the spec version the generated pages are about to announce.
      #
      # Sets `publishable`, which is the only thing `deploy` keys off. It is deliberately a SKIP
      # and not a failure: being ahead of the registries is the normal, expected state for the
      # minutes or hours between the version bump landing and the last package publishing, and a
      # red run there would cry wolf on every release.
      #
      # `>=` rather than `==`, by semver order: a runtime whose package version ever runs ahead of
      # the spec version it implements still satisfies "this version is published".
      #
      # A registry that cannot be reached, or answers in a shape this does not understand, counts
      # as behind. That is the safe direction — the cost is a deploy deferred by thirty minutes,
      # against the cost of announcing a version nobody can install.
      - name: Gate on every runtime actually serving this spec version
        id: registries
        env:
          PINNED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail

          # A human dispatching this by hand is the documented escape hatch: redeploying a past
          # site-vX.Y.Z tag, or shipping a site-only fix, is them saying what they intend.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "manual dispatch — gate bypassed by design"
            echo "publishable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          spec_version=$(git show "${PINNED_SHA}:spec/VERSION" | tr -d '[:space:]')
          if ! printf '%s' "${spec_version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::spec/VERSION at ${PINNED_SHA} is not a version: ${spec_version}"
            exit 1
          fi
          echo "the site this commit generates would announce spec ${spec_version}"

          # `sort -V` is coreutils' version sort: the smaller of the two sorts first, so "$1 is the
          # smaller" is exactly "$1 <= $2".
          at_least() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$1" ]; }

          # Nothing to publish is the overwhelmingly common scheduled case. Answer it with one
          # request against the live site rather than a checkout, an npm ci and a full rebuild.
          # An unreadable answer falls through to the real work: a redundant deploy of identical
          # bytes is harmless, a missed one is not.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            live=$(curl -sfS --max-time 20 "https://polytypo.dev/" 2>/dev/null \
              | grep -oE 'spec [0-9]+\.[0-9]+\.[0-9]+' | head -1 | cut -d' ' -f2 || true)
            if [ -n "${live}" ] && at_least "${spec_version}" "${live}"; then
              echo "the live site already announces spec ${live} — nothing to publish"
              echo "publishable=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "live site announces \"${live:-unknown}\" — checking whether ${spec_version} is installable"
          fi

          ask() {
            curl -sfS --retry 3 --retry-delay 2 --max-time 30 "$1" 2>/dev/null \
              | python3 -c "$2" 2>/dev/null || true
          }

          lagging=""
          check() {
            local name="$1" got="${2#v}"
            if [ -z "${got}" ]; then
              echo "  wait ${name}: unreachable or unrecognised response"
              lagging="${lagging} ${name}"
            elif at_least "${spec_version}" "${got}"; then
              echo "  ok   ${name} serves ${got}"
            else
              echo "  wait ${name} serves ${got}"
              lagging="${lagging} ${name}"
            fi
          }

          check npm "$(ask https://registry.npmjs.org/polytypo/latest \
            'import json,sys;print(json.load(sys.stdin)["version"])')"
          check pypi "$(ask https://pypi.org/pypi/polytypo/json \
            'import json,sys;print(json.load(sys.stdin)["info"]["version"])')"
          check rubygems "$(ask https://rubygems.org/api/v1/gems/polytypo.json \
            'import json,sys;print(json.load(sys.stdin)["version"])')"
          check packagist "$(ask https://repo.packagist.org/p2/polytypo/polytypo.json \
            'import json,sys;d=json.load(sys.stdin);print(max(p["version"] for p in d["packages"]["polytypo/polytypo"]))')"
          check go "$(ask https://proxy.golang.org/github.com/polytypo/polytypo-go/@latest \
            'import json,sys;print(json.load(sys.stdin)["Version"])')"

          if [ -n "${lagging}" ]; then
            echo "::notice::deploy skipped — spec ${spec_version} is not yet served by:${lagging}. The scheduled run will publish it once they catch up; nobody needs to do anything."
            echo "publishable=false" >> "$GITHUB_OUTPUT"
          else
            echo "all five runtimes serve spec ${spec_version} or newer — publishable"
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build and deploy
    needs: verify
    # The one gate `verify` cannot express as a job condition on itself: `publishable` is false
    # while any runtime is behind the spec version this commit's pages would announce, and false
    # for a scheduled run that found nothing to publish. See the header's release-window note.
    if: needs.verify.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # The protected environment (§7.1): GitHub restricts a Pages-sourced `github-pages`
    # environment to the default branch by default; a required-reviewer rule on top of that is
    # configured once, by a repository admin, in Settings → Environments — not by this file. That
    # approval sits ON TOP of `verify`'s provenance checks above, never in place of them: this job
    # is only reachable at all if `verify` already proved the commit's ancestry/tag and CI status.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No fetch-depth: 0 here — unlike verify, this job does no ancestry walk, only builds the
      # one commit verify already resolved and vouched for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same isolated brand/promo toolchain ci.yml's own "Check generated artifacts are up to
      # date" step uses (fonttools/brotli for gen:brandbook) — an isolated venv with only the
      # pinned versions from brand/tools/requirements.txt, not the runner's preinstalled global
      # site-packages, so this build is exactly as reproducible as CI already proved it to be.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up isolated Python virtual environment for brand/promo generation
        run: |
          python3 -m venv .venv-brand
          echo "$PWD/.venv-brand/bin" >> "$GITHUB_PATH"
          .venv-brand/bin/pip install -r brand/tools/requirements.txt

      # Belt-and-suspenders, not a substitute for CI's own drift check: ci.yml already proved
      # zero drift at this exact commit (that's part of why `verify` above requires CI to have
      # passed for it) — regenerating here and re-diffing proves it again, against this runner's
      # own toolchain, immediately before the bytes it produces are what actually gets published.
      - name: Regenerate the site and require zero generated-artifact drift
        run: |
          npm run generate:all
          git diff --exit-code -- \
            README.md \
            promo/examples.json \
            promo/index.html \
            promo/docs/index.html \
            promo/locales/index.html \
            promo/playground/index.html \
            promo/manifesto/index.html \
            promo/robots.txt \
            promo/sitemap.xml \
            promo/llms.txt \
            promo/badge.js \
            promo/assets \
            promo/vendor/polytypo.browser.js \
            brand/BRANDBOOK.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # promo/ is the deterministic generated output already verified driftless above — the
      # entire Pages artifact, uploaded as-is. No custom domain / CNAME file is created here; see
      # §7.1's citation of GitHub's own documentation that workflow-based Pages publishing creates
      # or requires none — the custom domain is configured once, separately, in Settings → Pages.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: promo/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
